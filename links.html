<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AQUAREV Travel | Links</title>

    <link rel="icon" href="/assets/logo/aquarev.png" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 10px 25px;
        color: #fff;

        background:
          linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)),
          url("/assets/images/image.jpg") center/cover fixed no-repeat;
      }

      .logo {
        width: 130px;
        height: auto;
        margin: 0 auto -20px;
        background: transparent;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .logo img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 30px;
        color: #87ceeb;
        text-align: center;
      }

      .subtitle {
        color: #a7eaec;
        margin-bottom: 25px;
        text-align: center;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-decoration: none;
        color: #fff;
        background: rgba(10, 10, 10, 0.45);
        border: 1px solid #d4af37;
        padding: 16px;
        border-radius: 50px;
        margin: 12px 0;
        font-weight: bold;
        transition: 0.3s;
      }

      .link:hover {
        transform: translateY(-3px);
        background: #66c5eb;

        color: #111;
      }

      .fa-globe {
        color: #00bcd4;
      }

      .fa-facebook {
        color: #1877f2;
      }

      .fa-instagram {
        color: #19b93c;
      }

      .fa-tiktok {
        color: #f7f4f4;
      }

      .fa-whatsapp {
        color: #25d366;
      }

      .fa-envelope {
        color: #28cee4;
      }

      .fa-location-dot {
        color: #68dbeb;
      }

      .footer {
        margin-top: 22px;
        color: #000;
        font-size: 13px;
        text-align: center;
      }

      .location-link {
        font-size: 13px;
        gap: 8px;
      }
      .container {
        transform: translateY(-25px);
      }
      @media (max-width: 480px) {
        .container {
          padding: 20px;
        }

        .logo {
          width: 110px;
          height: 110px;
        }

        h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="logo">
        <img src="/assets/logo/aquarev.png" alt="AQUAREV" />
      </div>

      <h1>AQUAREV Travel</h1>

      <p class="subtitle">Dream Destinations, Endless Memories</p>

      <a
        class="link"
        href="https://aquarev-travel-anfn.onrender.com/"
        target="_blank"
      >
        <i class="fa-solid fa-globe"></i>
        Plateforme AQUAREV Travel
      </a>

      <a
        class="link"
        href="https://web.facebook.com/aquarevtravel"
        target="_blank"
      >
        <i class="fa-brands fa-facebook"></i>
        Facebook
      </a>

      <a
        class="link"
        href="https://www.instagram.com/aquarevtravel"
        target="_blank"
      >
        <i class="fa-brands fa-instagram"></i>
        Instagram
      </a>

      <a
        class="link"
        href="https://www.tiktok.com/@aquarev_travel?_r=1&_t=ZS-98coULvcLxg"
        target="_blank"
      >
        <i class="fa-brands fa-tiktok"></i>
        TikTok
      </a>

      <a class="link" href="https://wa.me/213554958578" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp 1
      </a>

      <a class="link" href="https://wa.me/213541116245" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
        WhatsApp 2
      </a>

      <a class="link" href="mailto:aquarev.travel@gmail.com">
        <i class="fa-solid fa-envelope"></i>
        aquarev.travel@gmail.com
      </a>

      <a
        class="link location-link"
        href="https://www.google.com/maps/search/?api=1&query=AQUAREV+Travel+04+Chemin+Allaghane+Tazmalt+Bejaia+Algeria"
        target="_blank"
      >
        <i class="fa-solid fa-location-dot"></i>

        04 Chemin Allaghane, Tazmalt<br />
        Béjaïa
      </a>

      <div class="footer">© 2026 AQUAREV Travel</div>
    </div>
  </body>
</html>
