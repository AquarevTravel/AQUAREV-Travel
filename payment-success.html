<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>AQUAREV Travel - Payment Successful</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e8f8ff, #fff, #dff6ff);
        font-family: Arial, sans-serif;
        color: #023e8a;
      }
      .card {
        width: min(90%, 600px);
        background: rgba(255, 255, 255, 0.95);
        border-radius: 25px;
        padding: 50px 30px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 80, 130, 0.2);
      }
      .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: #168a45;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 50px;
        font-weight: bold;
      }
      h1 {
        font-size: 32px;
        margin-bottom: 15px;
        color: #0077b6;
      }
      p {
        font-size: 17px;
        line-height: 1.7;
        color: #12343b;
        margin-bottom: 25px;
      }
      a {
        display: inline-block;
        padding: 14px 30px;
        border-radius: 30px;
        background: linear-gradient(135deg, #00b4d8, #0077b6);
        color: #fff;
        text-decoration: none;
        font-weight: bold;
      }
      a:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Payment Successful</h1>
      <p>Your payment has been successfully processed.</p>
      <p>Thank you for choosing AQUAREV Travel.</p>
      <a href="/">Return to AQUAREV Travel</a>
    </div>
  </body>
</html>
